version: 2

models:
  - name: silver_geolocation
    description: "Dimensão de geolocalização deduplicada, 1 linha por CEP"
    columns:
      - name: zip_code_prefix
        tests:
          - unique
          - not_null

  - name: silver_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null

  - name: silver_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: silver_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: silver_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - invoiced
                - processing
                - unavailable
                - created
                - approved

  - name: silver_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null

  - name: silver_order_payments
    columns:
      - name: payment_type
        tests:
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined

  - name: silver_order_reviews
    columns:
      - name: review_id
        tests:
          - unique
          - not_null
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false
